

server:
  port: 8080
spring:
  application:
    name: accounts

 # datasource:
   # url: jdbc:mysql://localhost:3306/accounts
   # username: root
  #  password: password
   # driver-class-name: com.mysql.cj.jdbc.Driver
  datasource:
    url: jdbc:h2:mem:testdb;
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true